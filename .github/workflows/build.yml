name: Build WorldGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Offiziellen Quellcode 7.0.17 holen
        run: git clone --depth 1 --branch 7.0.17 https://github.com/EngineHub/WorldGuard.git wg
      - name: Safe-Spawn Aenderungen einspielen
        run: |
          ls -la
          unzip -q -o WorldGuard-7.0.17-safespawn-source.zip -d tmp
          ls tmp/WorldGuard-7.0.17
          cp -r tmp/WorldGuard-7.0.17/worldguard-core/. wg/worldguard-core/
          cp -r tmp/WorldGuard-7.0.17/worldguard-bukkit/. wg/worldguard-bukkit/
          ls wg
      - name: Build
        run: |
          cd wg
          chmod +x gradlew
          ./gradlew assemble --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: worldguard-jar
          path: wg/worldguard-bukkit/build/libs/*.jar
